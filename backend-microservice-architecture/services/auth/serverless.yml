service: lifebookz-auth

frameworkVersion: "3"

# ---------------------------------------------------------------------------
# Auth is the only component that can mint a token. It also owns the public
# OTP-abuse counters (DynamoDB + TTL) that API Gateway throttling cannot
# express, and it publishes `AccountRegistered` / `OtpRequested` etc. to the
# shared `lifebookz-events` bus created by the `system` stack.
#
# Deployment order: system → auth → story/consultation/notification → workers
# (the `system` stack owns the shared HTTP API and the event bus).
# ---------------------------------------------------------------------------

provider:
  name: aws
  runtime: nodejs22.x
  region: ${env:AWS_REGION, 'ap-south-1'}
  stage: ${opt:stage, 'dev'}
  architecture: x86_64
  memorySize: 512
  timeout: 15
  logRetentionInDays: 30

  # Attach to the ONE shared HTTP API (owned by the `system` stack).
  # With an external API, CORS / access logs / authorizers are configured in
  # the owning stack — that is intentional, it keeps them in one place.
  httpApi:
    id: !ImportValue lifebookz-${sls:stage}-http-api-id

  environment:
    NODE_ENV: ${sls:stage}
    AWS_REGION: ${self:provider.region}
    SERVICE_NAME: auth

    # Platform (imported from the system stack)
    EVENT_BUS_NAME: !ImportValue lifebookz-${sls:stage}-event-bus-name
    HTTP_API_ID: !ImportValue lifebookz-${sls:stage}-http-api-id
    JWT_AUTHORIZER_ID: !ImportValue lifebookz-${sls:stage}-jwt-authorizer-id

    # Identity
    JWT_ISSUER: ${env:JWT_ISSUER, 'https://api.lifebookz.com'}
    JWT_AUDIENCE: ${env:JWT_AUDIENCE, 'lifebookz-api'}
    JWT_KID: ${env:JWT_KID, 'lifebookz-auth-2026-09'}
    ACCESS_TOKEN_TTL_SECONDS: ${env:ACCESS_TOKEN_TTL_SECONDS, '900'}
    REFRESH_TOKEN_TTL_DAYS: ${env:REFRESH_TOKEN_TTL_DAYS, '30'}
    OTP_REQUEST_LIMIT_PER_HOUR: ${env:OTP_REQUEST_LIMIT_PER_HOUR, '3'}
    OTP_VERIFY_LIMIT_PER_HOUR: ${env:OTP_VERIFY_LIMIT_PER_HOUR, '5'}
    LOGIN_ATTEMPT_LIMIT: ${env:LOGIN_ATTEMPT_LIMIT, '10'}
    OTP_TTL_SECONDS: ${env:OTP_TTL_SECONDS, '600'}
    RESET_TOKEN_TTL_SECONDS: ${env:RESET_TOKEN_TTL_SECONDS, '300'}
    BCRYPT_ROUNDS: ${env:BCRYPT_ROUNDS, '12'}
    MONGO_MAX_POOL_SIZE: ${env:MONGO_MAX_POOL_SIZE, '10'}

    # Secrets: only the *ids* live here. Values come from Secrets Manager.
    MONGODB_AUTH_URI_SECRET_ID: ${env:MONGODB_AUTH_URI_SECRET_ID, ''}
    JWT_PRIVATE_KEY_SECRET_ID: ${env:JWT_PRIVATE_KEY_SECRET_ID, 'lifebookz/auth/jwt-signing-key'}
    INTERNAL_SERVICE_TOKEN_SECRET_ID: ${env:INTERNAL_SERVICE_TOKEN_SECRET_ID, 'lifebookz/internal/service-token'}
    ADMIN_CREDENTIALS_SECRET_ID: ${env:ADMIN_CREDENTIALS_SECRET_ID, 'lifebookz/admin-credentials'}
    DEVELOPER_CREDENTIALS_SECRET_ID: ${env:DEVELOPER_CREDENTIALS_SECRET_ID, 'lifebookz/developer-credentials'}

    DYNAMODB_OTP_LIMITS_TABLE: !Ref OtpLimitsTable

    # Cloudflare R2 (reader profile media only)
    R2_BUCKET_NAME: ${env:R2_BUCKET_NAME, 'lifebookz'}
    R2_ENDPOINT: ${env:R2_ENDPOINT, ''}
    R2_PUBLIC_BASE_URL: ${env:R2_PUBLIC_BASE_URL, ''}
    R2_ACCESS_KEY_ID: ${env:R2_ACCESS_KEY_ID, ''}
    R2_SECRET_ACCESS_KEY: ${env:R2_SECRET_ACCESS_KEY, ''}

  stackTags: &tags
    Project: lifebookz
    Service: auth
    ManagedBy: serverless
  tags: *tags

  iam:
    role:
      statements:
        # Least privilege: this service publishes domain events and nothing else.
        - Effect: Allow
          Action: events:PutEvents
          Resource: !ImportValue lifebookz-${sls:stage}-event-bus-arn

        # OTP / login abuse counters (TTL table owned by this stack).
        - Effect: Allow
          Action:
            - dynamodb:UpdateItem
            - dynamodb:GetItem
          Resource: !GetAtt OtpLimitsTable.Arn

        # Only the secrets Auth actually reads. Note the `*` suffix: Secrets
        # Manager appends a random 6 characters to every ARN.
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource:
            - arn:aws:secretsmanager:*:${env:AWS_ACCOUNT_ID, '*'}:secret:lifebookz/auth/*
            - arn:aws:secretsmanager:*:${env:AWS_ACCOUNT_ID, '*'}:secret:lifebookz/internal/*
            - arn:aws:secretsmanager:*:${env:AWS_ACCOUNT_ID, '*'}:secret:lifebookz/admin-credentials*
            - arn:aws:secretsmanager:*:${env:AWS_ACCOUNT_ID, '*'}:secret:lifebookz/developer-credentials*

functions:
  api:
    name: lifebookz-auth-${sls:stage}-api
    handler: src/handlers/api.handler
    description: LifeBookz auth API (register, login, RSA tokens, OTP reset, JWKS)
    timeout: 20
    memorySize: 512
    # Guards the Auth Mongo cluster: 100 containers × maxPoolSize 10 = 1000
    # connections, safely inside an Atlas M10 ceiling.
    reservedConcurrency: 100
    events:
      # ------------------------------------------------------ public routes
      - httpApi:
          method: GET
          path: /.well-known/openid-configuration
      - httpApi:
          method: GET
          path: /.well-known/jwks.json
      - httpApi:
          method: POST
          path: /api/v1/auth/register
      - httpApi:
          method: POST
          path: /api/v1/auth/login
      - httpApi:
          method: POST
          path: /api/v1/auth/refresh
      - httpApi:
          method: POST
          path: /api/v1/auth/forgot-password
      - httpApi:
          method: POST
          path: /api/v1/auth/verify-reset-otp
      - httpApi:
          method: POST
          path: /api/v1/auth/reset-password
      - httpApi:
          method: GET
          path: /api/v1/users/{userId}

      # ------------------------------- JWT protected (API Gateway authorizer)
      - httpApi:
          method: POST
          path: /api/v1/auth/logout
          authorizer:
            type: jwt
            id: !ImportValue lifebookz-${sls:stage}-jwt-authorizer-id
      - httpApi:
          method: GET
          path: /api/v1/auth/me
          authorizer:
            type: jwt
            id: !ImportValue lifebookz-${sls:stage}-jwt-authorizer-id
      - httpApi:
          method: PATCH
          path: /api/v1/auth/me
          authorizer:
            type: jwt
            id: !ImportValue lifebookz-${sls:stage}-jwt-authorizer-id
      - httpApi:
          method: GET
          path: /api/v1/users/me
          authorizer:
            type: jwt
            id: !ImportValue lifebookz-${sls:stage}-jwt-authorizer-id
      - httpApi:
          method: PATCH
          path: /api/v1/users/me
          authorizer:
            type: jwt
            id: !ImportValue lifebookz-${sls:stage}-jwt-authorizer-id
      - httpApi:
          method: DELETE
          path: /api/v1/users/me
          authorizer:
            type: jwt
            id: !ImportValue lifebookz-${sls:stage}-jwt-authorizer-id
      - httpApi:
          method: POST
          path: /api/v1/users/me/media/presign
          authorizer:
            type: jwt
            id: !ImportValue lifebookz-${sls:stage}-jwt-authorizer-id

      # --------------------------------- service token (system → auth only)
      - httpApi:
          method: PATCH
          path: /api/v1/internal/accounts/{accountId}/verification

resources:
  Resources:
    # Short-lived OTP / login counters. TTL removes the rows, so there is no
    # cleanup job and no unbounded growth.
    OtpLimitsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: lifebookz-auth-otp-limits-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
        SSESpecification:
          SSEEnabled: true

  Outputs:
    AuthApiFunctionName:
      Value: !Ref ApiLambdaFunction
      Export:
        Name: lifebookz-${sls:stage}-auth-api-function
